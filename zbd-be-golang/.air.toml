# 개발 모드 — 저장하면 다시 빌드·재시작.
#   설치: go install github.com/air-verse/air@latest   실행: air
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  entrypoint = ["./tmp/server"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", "vendor"]
  delay = 300
  kill_delay = "1s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
